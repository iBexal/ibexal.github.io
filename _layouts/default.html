<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if page.title %}
            {{ page.title }} | {{ site.title }}
        {% else %}
            {{ site.title }}
        {% endif %}
    </title>

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"

>
</head>

<body>

<header>
    <div class="container">
        <a class="site-title" href="{{ '/' | relative_url }}">
            {{ site.title }}
        </a>
        <nav>
            <a href="{{ '/' | relative_url }}">Home</a>
            {% for path in site.header_pages %}
                {% assign page_item = site.pages | where: "path", path | first %}
                {% if page_item %}
                    <a href="{{ page_item.url | relative_url }}">
                        {{ page_item.title }}
                    </a>
                {% endif %}
            {% endfor %}
        </nav>
    </div>
</header>


<main>
    {{ content }}
</main>


<footer>
    <div class="container">
        <p>
            PhD Student at Macquarie University, Sydney<br>
            Galactic Archaeology | Stellar Spectroscopy
        </p>
    </div>
</footer>

</body>
</html>
