<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if page.title %}
            {{ page.title }} | {{ site.title }}
        {% else %}
            {{ site.title }}
        {% endif %}
    </title>

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<header>
    <div class="container">
        <a class="site-title" href="{{ '/' | relative_url }}">
            {{ site.title }}
        </a>
        <button class="menu-toggle" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav>
            <a href="/">Home</a>
            <a href="/about/">About</a>

            <div class="nav-dropdown">
                <a href="/research/" class="nav-dropdown-toggle">Research</a>

                <div class="nav-dropdown-menu">
                    <a href="/research/#research">My Research</a>
                    <a href="/research/#experiences">Research Engagement</a>
                    <a href="/research/#projects">Projects</a>
                </div>
            </div>

            <a href="/publications/">Publications</a>
        </nav>
    </div>
</header>


<main>
    {{ content }}
</main>


<footer>
    <div class="container">
        <p>
            PhD Student at Macquarie University, Sydney<br>
            Galactic Archaeology | Stellar Spectroscopy
        </p>
    </div>
</footer>

<!-- Hamburger -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const menuToggle = document.querySelector(".menu-toggle");
    const nav = document.querySelector("nav");

    /* Hamburger menu */
    menuToggle.addEventListener("click", function () {
        nav.classList.toggle("open");
    });
});
</script>

</body>
</html>
